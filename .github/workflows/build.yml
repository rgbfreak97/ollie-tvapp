name: TV-app bouwen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bouwen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ollie-on-air.apk

      - name: APK als download bij deze run
        uses: actions/upload-artifact@v4
        with:
          name: ollie-on-air-apk
          path: ollie-on-air.apk

      - name: APK publiceren als release (vaste downloadlink)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app
          name: Ollie on Air TV-app
          body: "Download ollie-on-air.apk en installeer hem op de tv."
          files: ollie-on-air.apk
          make_latest: true
