plugins {
    id 'com.android.application'
}

// Op GitHub krijgt elke bouw vanzelf een hoger versienummer, en weet de app waar hij updates kan vinden.
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
def repo = System.getenv('GITHUB_REPOSITORY') ?: ''
def updateBase = repo ? "https://github.com/${repo}/releases/latest/download/" : ''

android {
    namespace 'nl.crijns.ollieonair'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.crijns.ollieonair'
        minSdk 26
        targetSdk 35
        versionCode 100 + runNumber
        versionName "2.${runNumber}"
        buildConfigField 'String', 'UPDATE_BASE', "\"${updateBase}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Vaste sleutel, zodat een nieuwere versie gewoon over de oude heen installeert
    signingConfigs {
        ollie {
            storeFile file('ollie.keystore')
            storePassword 'ollieonair'
            keyAlias 'ollie'
            keyPassword 'ollieonair'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ollie
        }
        debug {
            signingConfig signingConfigs.ollie
        }
    }

    // geen Play Store-keuring nodig: bouwen niet laten stoppen op lint-waarschuwingen
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
